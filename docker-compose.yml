services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge_base
    ports:
      - "5433:5432"  # 5432 is often already taken by a local Postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: engine/backend
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/knowledge_base
      CONFIG_DIR: /config
      OBJECTS_DIR: /data/objects
      WORKSPACE_DIR: /data/workspace
    ports:
      - "8000:8000"
    volumes:
      # identity.md, assistant.yaml, routing.yaml — all optional, all cached at
      # startup, so editing one means `docker compose restart api`.
      - ./config:/config:ro
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: engine/frontend
      args:
        # Next inlines NEXT_PUBLIC_* at build time, so serving the UI from
        # another host means rebuilding with this set, not just restarting.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Document parsing, on demand rather than always-on: this image carries torch
  # and OpenCV, which the API does not need, and a run costs money in embeddings
  # and summaries.
  #   make ingest     turn everything in data/raw/ into a queryable corpus
  ingest:
    profiles: ["ingest"]
    build:
      context: engine/backend
      target: ingest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/knowledge_base
      CONFIG_DIR: /config
      RAW_DIR: /data/raw
      OBJECTS_DIR: /data/objects
      WORKSPACE_DIR: /data/workspace
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - model-cache:/root/.cache
      - easyocr-cache:/root/.EasyOCR
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  model-cache:
  easyocr-cache:
