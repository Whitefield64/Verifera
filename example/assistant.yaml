# What the reader sees around the answer. Everything here is optional: drop a
# key and the engine's default takes over (app/assistant.py).

title: EU AI Regulation Assistant
description: >-
  Grounded question answering over the EU AI Act and the acts, guidelines and
  frameworks around it. Every claim points back to the exact passage in the
  original document.

# Language the assistant presents itself in. Answers always follow the language
# of the question — this only drives the UI and the ingestion-time summaries.
locale: en

ui:
  heading: EU AI Regulation Assistant
  tagline: Ask about the AI Act — every answer cites the passage it came from.
  placeholder: Ask a question…
  # Seeded into the empty chat. Keep them answerable from the corpus.
  suggestions:
    - When do the prohibitions in Article 5 of the AI Act start to apply?
    - Compare the obligations of a provider and a deployer of a high-risk AI system.
    - What are the penalty tiers for non-compliance, and what determines which applies?

# Fixed replies the system emits in its own voice, in the locale above.
messages:
  no_context: >-
    The available documentation does not contain information to answer this
    question.
  agent_failed: >-
    The in-depth path did not complete; falling back to a quick search.
  no_answer: >-
    I could not produce a useful answer from the documents I consulted.
