name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/backend/requirements-dev.txt
      # The suite covers the ingestion pipeline, so it needs the parsing stack.
      # No database, no network and no API key: the tests that would need them
      # are the evaluation set, which runs against a live system by hand.
      - run: pip install -r engine/backend/requirements-dev.txt
      - run: ruff check engine
      - run: python -m pytest tests -q
        working-directory: engine/backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Structural validation only — no backend, no spend.
      - run: python3 engine/benchmark/run.py --validate-only

