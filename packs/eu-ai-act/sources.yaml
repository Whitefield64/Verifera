# Where this pack's corpus comes from.
#
#   python -m corpus sync           fetch into the ingestion inbox
#   python -m corpus sync --check   report what changed upstream, download nothing
#   python -m corpus status         declared sources vs what the manifest holds
#
# Documents are NOT redistributed in this repository. Each entry records the
# publisher's reuse terms; `license` is informational provenance, not advice.
#
# Reuse regimes referenced below:
#   EUR-Lex   Commission Decision 2011/833/EU — free reuse with acknowledgement
#   NIST      work of the U.S. government, public domain in the United States
#
# Deliberately excluded: ISO/IEC 42001 and other ISO standards are not freely
# redistributable and cannot be fetched by a public script.
#
# `category` describes what the document IS. It is independent of the topic
# labels in pack.yaml, which classify evaluation questions.

sources:
  # ── The instrument the pack is about ────────────────────────────────────────
  - id: ai-act-en
    title: "Regulation (EU) 2024/1689 — Artificial Intelligence Act"
    url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R1689"
    category: core-regulation
    format: html
    lang: en
    license: "EUR-Lex — Decision 2011/833/EU"
    notes: "Full text: 113 articles and 13 annexes, including the Annex III high-risk list."

  - id: ai-act-en-pdf
    title: "Regulation (EU) 2024/1689 — Artificial Intelligence Act (Official Journal PDF)"
